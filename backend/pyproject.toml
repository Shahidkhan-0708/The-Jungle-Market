[project]
name = "jungle-market-backend"
version = "0.1.1"
description = "Production-minded MVP backend for Jungle Market."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "celery>=5.4.0",
  "redis>=5.0.8",
  "python-multipart>=0.0.9",
  "pillow>=10.4.0",
  "numpy>=1.26.4",
  "opencv-python-headless>=4.10.0.84",
  "rembg>=2.0.57",
  "onnxruntime>=1.18.1",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "transformers>=4.44.0,<5",
  "faster-whisper>=1.0.3",
  "catboost>=1.2.5",
  "pandas>=2.2.2",
  "scikit-learn>=1.5.1",
  "joblib>=1.4.2",
  "prometheus-client>=0.20.0",
  "supabase>=2.7.4",
  "google-genai>=1.0.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.2",
  "mypy>=1.11.1",
]

[build-system]
requires = ["setuptools>=72.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "jungle_market*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"] # FastAPI dependency declarations intentionally call Depends/File/Form.

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
