services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - jungle_media:/data/jungle-market-media
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: celery -A apps.worker.celery_app worker --loglevel=INFO
    volumes:
      - jungle_media:/data/jungle-market-media
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  postgres_data:
  jungle_media:
