[tool.poetry]
name = "jungle-market"
version = "0.1.0"
description = "Jungle Market Platform MVP"
authors = ["Admin <admin@example.com>"]
readme = "README.md"
packages = [{include = "jungle_market"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = "^0.30.1"
pydantic = "^2.7.4"
pydantic-settings = "^2.3.4"
httpx = "^0.28.1"
openai = ">=1.0,<4.0"
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
aiosqlite = "^0.20.0"
supabase = "^2.7.4"
celery = "^5.4.0"
redis = "^5.0.7"
pillow = "^10.3.0"
numpy = "^1.26.4"
opencv-python-headless = "^4.10.0.84"
catboost = "^1.2.5"
pandas = "^2.2.2"
scikit-learn = "^1.5.0"
joblib = "^1.4.2"

[tool.poetry.group.local-ml]
optional = true

[tool.poetry.group.local-ml.dependencies]
rembg = "^2.0.57"
onnxruntime = "^1.18.0"
faster-whisper = "^1.0.3"
llama-cpp-python = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
black = "^24.4.2"
isort = "^5.13.2"
flake8 = "^7.1.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
